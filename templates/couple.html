<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Notre histoire</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #F4EEE6;
    --midnight: #14102A;
    --midnight-deep: #0B0817;
    --gold: #D4AF7A;
    --blush: #E9A6A0;
    --thread: #C79A5C;
    --muted: #9A93B5;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: radial-gradient(circle at 50% 0%, #201a3d 0%, var(--midnight) 45%, var(--midnight-deep) 100%);
    color: var(--ink);
    font-family: 'Jost', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .stars {
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 20% 30%, rgba(244,238,230,0.5), transparent),
      radial-gradient(1px 1px at 70% 15%, rgba(244,238,230,0.4), transparent),
      radial-gradient(1.5px 1.5px at 85% 60%, rgba(244,238,230,0.35), transparent),
      radial-gradient(1px 1px at 40% 80%, rgba(244,238,230,0.4), transparent),
      radial-gradient(1px 1px at 10% 65%, rgba(244,238,230,0.3), transparent),
      radial-gradient(1.5px 1.5px at 60% 45%, rgba(244,238,230,0.3), transparent);
    pointer-events: none;
    z-index: 0;
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 480px;
    margin: 0 auto;
    padding: 40px 24px 56px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-style: italic;
    font-size: 30px;
    text-align: center;
    color: var(--ink);
    margin-bottom: 6px;
  }

  .since {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.08em;
    margin-bottom: 44px;
  }

  .duo {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    margin-bottom: 8px;
  }

  .thread-svg {
    position: absolute;
    top: 50%;
    left: 0;
    width: 100%;
    transform: translateY(-50%);
    z-index: 0;
  }

  .portrait {
    position: relative;
    z-index: 2;
    width: 128px;
    height: 128px;
    border-radius: 50%;
    overflow: hidden;
    border: 2px solid var(--gold);
    box-shadow: 0 0 0 6px rgba(212,175,122,0.08), 0 20px 40px rgba(0,0,0,0.45);
    background: #241d47;
  }

  .portrait img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .portrait.placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Fraunces', serif;
    font-size: 40px;
    color: var(--gold);
  }

  .portrait-wrap {
    position: relative;
    z-index: 2;
  }

  .upload-btn {
    position: absolute;
    bottom: -2px;
    right: -2px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--gold);
    border: 2px solid var(--midnight-deep);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 4;
    transition: transform 0.15s ease;
  }

  .upload-btn:active { transform: scale(0.9); }

  .upload-btn svg { width: 16px; height: 16px; }

  .upload-btn input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
  }

  .heart-badge {
    position: relative;
    z-index: 3;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--midnight-deep);
    border: 1px solid var(--thread);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 -6px;
    animation: pulse 2.6s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.12); }
  }

  .heart-badge svg { width: 18px; height: 18px; }

  .names {
    display: flex;
    justify-content: space-between;
    width: 100%;
    max-width: 320px;
    margin-top: 18px;
    margin-bottom: 46px;
  }

  .name-block { text-align: center; width: 128px; }

  .name {
    font-family: 'Fraunces', serif;
    font-size: 17px;
    color: var(--ink);
  }

  .role {
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--blush);
    margin-top: 4px;
  }

  .divider {
    width: 40px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--thread), transparent);
    margin-bottom: 32px;
  }

  .counter-label {
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .counter {
    font-family: 'Fraunces', serif;
    font-size: 15px;
    color: var(--gold);
    text-align: center;
    line-height: 1.6;
    margin-bottom: 8px;
  }

  /* ---- Mois-versaire ---- */
  .monthiversary-card {
    width: 100%;
    max-width: 320px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(212,175,122,0.25);
    border-radius: 18px;
    padding: 22px;
    margin: 8px auto 40px;
    text-align: center;
  }
  .month-count {
    font-family: 'Fraunces', serif;
    font-size: 44px;
    color: var(--gold);
    line-height: 1;
    margin-bottom: 4px;
  }
  .month-count-label {
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 18px;
  }
  .next-month-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding-top: 16px;
    border-top: 1px solid rgba(255,255,255,0.07);
    font-size: 12.5px;
    color: var(--ink);
  }
  .next-month-row b { color: var(--blush); font-weight: 500; }
  .next-month-days {
    font-family: 'Fraunces', serif;
    font-style: italic;
    color: var(--gold);
  }

  .footer {
    margin-top: 48px;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: center;
  }

  .footer span { color: var(--blush); }

  /* ---- Cœurs dorés flottants ---- */
  .hearts-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 5;
  }
  .floating-heart {
    position: absolute;
    bottom: -40px;
    color: var(--gold);
    opacity: 0.55;
    animation: floatUp linear infinite;
    filter: drop-shadow(0 0 4px rgba(212,175,122,0.5));
  }
  @keyframes floatUp {
    0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
    10% { opacity: 0.6; }
    90% { opacity: 0.5; }
    100% { transform: translateY(-115vh) translateX(var(--drift, 20px)) rotate(25deg); opacity: 0; }
  }

  /* ---- Portraits cliquables ---- */
  .portrait { cursor: pointer; }
  .portrait.placeholder { cursor: pointer; }

  /* ---- Modale profil ---- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(8, 6, 18, 0.72);
    backdrop-filter: blur(6px);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 50;
  }
  .modal-overlay.open { display: flex; }

  .modal-sheet {
    width: 100%;
    max-width: 480px;
    background: linear-gradient(180deg, #201a3d 0%, #14102A 100%);
    border-top: 1px solid var(--thread);
    border-radius: 24px 24px 0 0;
    padding: 28px 24px 34px;
    max-height: 82vh;
    overflow-y: auto;
    animation: slideUp 0.28s ease;
  }
  @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  .modal-handle {
    width: 40px; height: 4px; border-radius: 2px;
    background: var(--muted); opacity: 0.4;
    margin: 0 auto 22px;
  }

  .modal-title {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    text-align: center;
    margin-bottom: 4px;
  }
  .modal-subtitle {
    text-align: center;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--blush);
    margin-bottom: 26px;
  }

  .field-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    gap: 12px;
  }
  .field-label {
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
  }
  .field-value {
    font-size: 14px;
    color: var(--ink);
    text-align: right;
    word-break: break-word;
  }
  .field-value[contenteditable="true"] {
    outline: none;
    border-bottom: 1px dashed var(--gold);
    min-width: 60px;
  }

  .modal-btn {
    width: 100%;
    margin-top: 22px;
    padding: 13px;
    border-radius: 14px;
    border: none;
    font-family: 'Jost', sans-serif;
    font-size: 13px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  .modal-btn:active { transform: scale(0.97); }
  .modal-btn.primary { background: var(--gold); color: var(--midnight-deep); }
  .modal-btn.ghost { background: transparent; border: 1px solid var(--thread); color: var(--ink); }
  .modal-btn.close-btn { background: transparent; color: var(--muted); text-decoration: underline; }

  .lock-icon { font-size: 34px; text-align: center; margin-bottom: 14px; }
  .lock-text { font-size: 13px; color: var(--muted); text-align: center; line-height: 1.6; margin-bottom: 6px; }
  .lock-price { font-family: 'Fraunces', serif; font-size: 20px; color: var(--gold); text-align: center; margin: 14px 0; }

  .code-input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid var(--thread);
    background: rgba(255,255,255,0.04);
    color: var(--ink);
    font-size: 14px;
    margin-top: 14px;
    text-align: center;
    letter-spacing: 0.1em;
  }
  .code-input::placeholder { color: var(--muted); }

  .error-text { color: var(--blush); font-size: 12px; text-align: center; margin-top: 8px; display: none; }
</style>
</head>
<body>
<div class="stars"></div>
<div class="hearts-layer" id="hearts-layer"></div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal-sheet" id="modal-sheet"></div>
</div>

<div class="wrap">
  <div class="eyebrow">Famille Ziox</div>
  <h1>Notre histoire</h1>
  <div class="since">Depuis toujours, un fil qui nous relie</div>

  <div class="monthiversary-card" id="monthiversary-card">
    <div class="month-count" id="month-count">—</div>
    <div class="month-count-label" id="month-count-label">mois ensemble</div>
    <div class="next-month-row">
      🎉 Prochain mois-versaire dans <span class="next-month-days" id="next-month-days">—</span>
    </div>
  </div>

  <div class="duo">
    <svg class="thread-svg" viewBox="0 0 320 20" preserveAspectRatio="none">
      <path d="M 20 10 Q 160 -10 300 10" stroke="#C79A5C" stroke-width="1" fill="none" opacity="0.6"/>
    </svg>
    <div class="portrait-wrap">
      <div class="portrait placeholder" id="owner-portrait" onclick="openProfile('owner')">♛</div>
    </div>

    <div class="heart-badge">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M12 21s-7.5-4.9-10-9.2C0.3 8.6 2 5 5.6 5c2 0 3.4 1 4.4 2.4C11 6 12.4 5 14.4 5 18 5 19.7 8.6 22 11.8 19.5 16.1 12 21 12 21z" fill="#D4AF7A"/>
      </svg>
    </div>

    <div class="portrait-wrap">
      <div class="portrait placeholder" id="partner-portrait" onclick="openProfile('partner')">♕</div>
    </div>
  </div>

  <div class="names">
    <div class="name-block">
      <div class="name" id="owner-name">En attente</div>
      <div class="role">Owner</div>
    </div>
    <div class="name-block">
      <div class="name" id="partner-name">En attente</div>
      <div class="role">Sa moitié</div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="counter-label">Ensemble depuis</div>
  <div class="counter" id="counter">— jours —</div>

  <div class="footer">Fil doré tissé par <span>Ziox Bot</span></div>
</div>

<script>
  if (window.Telegram && window.Telegram.WebApp) {
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
  }

  const BOT_USERNAME = "{{ bot_username }}";
  const UNLOCK_PRICE = {{ unlock_price }};

  // ====== 👇 CONFIGURE ICI 👇 ======
  const SINCE_DATE = "2026-02-02T00:00:00";
  // ====== 👆 FIN CONFIGURATION 👆 ======

  function renderMonthiversary() {
    const start = new Date(SINCE_DATE);
    const now = new Date();

    let months = (now.getFullYear() - start.getFullYear()) * 12 + (now.getMonth() - start.getMonth());
    if (now.getDate() < start.getDate()) months -= 1;
    if (months < 0) months = 0;

    document.getElementById('month-count').textContent = months;

    let next = new Date(now.getFullYear(), now.getMonth(), 2, 0, 0, 0);
    if (now > next) {
      next = new Date(now.getFullYear(), now.getMonth() + 1, 2, 0, 0, 0);
    }
    const daysUntil = Math.ceil((next - now) / (1000 * 60 * 60 * 24));
    const nextMonthCount = months + 1;

    let daysLabel;
    if (daysUntil === 0) daysLabel = "aujourd'hui ! 🎉";
    else if (daysUntil === 1) daysLabel = 'demain';
    else daysLabel = daysUntil + ' jours';

    document.getElementById('next-month-days').textContent = daysLabel + ` (${nextMonthCount} mois)`;
  }
  renderMonthiversary();
  setInterval(renderMonthiversary, 60000); // recalcule chaque minute (suffisant pour les mois/jours)

  // ---- Compteur EN DIRECT : jours, heures, minutes, secondes écoulés ----
  function renderLiveCounter() {
    const start = new Date(SINCE_DATE).getTime();
    const now = Date.now();
    const diff = now - start;

    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    const secs = Math.floor((diff % (1000 * 60)) / 1000);

    document.getElementById('counter').textContent =
      `${days}j ${String(hours).padStart(2,'0')}h ${String(mins).padStart(2,'0')}m ${String(secs).padStart(2,'0')}s à deux ✨`;
  }
  renderLiveCounter();
  setInterval(renderLiveCounter, 1000);

  const initData = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp.initData : "";

  let STATE = { authenticated: false, isEditor: false, editorRole: null, canView: false, profiles: {}, sinceDate: null };

  const PROFILE_FIELDS = [
    { key: 'prenom', label: 'Prénom' },
    { key: 'nom', label: 'Nom' },
    { key: 'telegram_id', label: 'ID Telegram' },
    { key: 'telephone', label: 'Téléphone' },
    { key: 'pays', label: 'Pays' },
    { key: 'bio', label: 'À propos' },
  ];

  async function loadStatus() {
    try {
      const res = await fetch('/api/status?initData=' + encodeURIComponent(initData));
      STATE = await res.json();
    } catch (e) {
      console.warn('Impossible de contacter le serveur', e);
    }
    renderHeader();
  }

  function renderHeader() {
    const owner = (STATE.profiles && STATE.profiles.owner) || {};
    const partner = (STATE.profiles && STATE.profiles.partner) || {};

    document.getElementById('owner-name').textContent = owner.name || (STATE.canView ? 'En attente' : 'Profil privé');
    document.getElementById('partner-name').textContent = partner.name || (STATE.canView ? 'En attente' : 'Profil privé');

    if (owner.photo) {
      document.getElementById('owner-portrait').outerHTML = `<div class="portrait" id="owner-portrait" onclick="openProfile('owner')"><img src="${owner.photo}"></div>`;
    }
    if (partner.photo) {
      document.getElementById('partner-portrait').outerHTML = `<div class="portrait" id="partner-portrait" onclick="openProfile('partner')"><img src="${partner.photo}"></div>`;
    }
  }

  function openProfile(who) {
    if (!STATE.authenticated) {
      renderNotInTelegramModal();
    } else if (!STATE.canView) {
      renderLockedModal(who);
    } else {
      const canEditThis = STATE.isEditor && STATE.editorRole === who;
      renderProfileModal(who, canEditThis);
    }
    document.getElementById('modal-overlay').classList.add('open');
  }

  function closeModal() {
    document.getElementById('modal-overlay').classList.remove('open');
  }

  function renderNotInTelegramModal() {
    document.getElementById('modal-sheet').innerHTML = `
      <div class="modal-handle"></div>
      <div class="lock-icon">📲</div>
      <div class="modal-title">Ouvre depuis Telegram</div>
      <div class="lock-text">Pour voir ou débloquer ce profil, ouvre cette page via le bouton "Notre histoire" du bot Telegram (commande /couple).</div>
      <button class="modal-btn primary" onclick="window.open('https://t.me/${BOT_USERNAME}', '_blank')">Ouvrir le bot</button>
      <button class="modal-btn close-btn" onclick="closeModal()">Fermer</button>
    `;
  }

  function renderLockedModal(who) {
    const displayName = (STATE.profiles && STATE.profiles[who] && STATE.profiles[who].name) || (who === 'owner' ? 'Owner' : 'Sa moitié');
    document.getElementById('modal-sheet').innerHTML = `
      <div class="modal-handle"></div>
      <div class="lock-icon">🔒</div>
      <div class="modal-title">Profil de ${displayName}</div>
      <div class="modal-subtitle">Accès privé</div>
      <div class="lock-text">Ce profil est réservé à la famille Ziox. Paye via le bot pour débloquer l'accès en lecture — le déblocage est automatique et instantané dès le paiement confirmé.</div>
      <div class="lock-price">${UNLOCK_PRICE.toLocaleString('fr-FR')} ⭐</div>
      <button class="modal-btn primary" onclick="window.open('https://t.me/${BOT_USERNAME}', '_blank')">💫 Payer via le bot</button>
      <div class="lock-text" style="margin-top:10px; font-size:11px;">Après paiement, reviens sur cette page et rouvre le profil — l'accès s'active tout seul.</div>
      <button class="modal-btn close-btn" onclick="closeModal()">Fermer</button>
    `;
  }

  function renderProfileModal(who, editable) {
    const profile = (STATE.profiles && STATE.profiles[who]) || {};
    const displayName = profile.name || (who === 'owner' ? 'Owner' : 'Sa moitié');

    const rows = PROFILE_FIELDS.map(f => `
      <div class="field-row">
        <div class="field-label">${f.label}</div>
        <div class="field-value" ${editable ? 'contenteditable="true"' : ''} data-key="${f.key}" id="field-${f.key}">
          ${profile[f.key] ? escapeHtml(profile[f.key]) : (editable ? '' : '—')}
        </div>
      </div>
    `).join('');

    document.getElementById('modal-sheet').innerHTML = `
      <div class="modal-handle"></div>
      <div class="modal-title">${displayName}</div>
      <div class="modal-subtitle">${editable ? 'Mode édition' : 'Profil famille Ziox'}</div>
      ${rows}
      <div id="save-feedback" style="display:none; text-align:center; color:var(--gold); font-size:12px; margin-top:10px;">✅ Enregistré !</div>
      ${editable ? '<button class="modal-btn primary" onclick="saveEditedProfile(\'' + who + '\')">✅ Enregistrer</button>' : ''}
      <button class="modal-btn close-btn" onclick="closeModal()">Fermer</button>
    `;
  }

  async function saveEditedProfile(who) {
    const profile = {};
    PROFILE_FIELDS.forEach(f => {
      const el = document.getElementById('field-' + f.key);
      profile[f.key] = el ? el.textContent.trim() : '';
    });
    try {
      const res = await fetch('/api/profile', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ initData, who, profile }),
      });
      if (res.ok) {
        document.getElementById('save-feedback').style.display = 'block';
        STATE.profiles = STATE.profiles || {};
        STATE.profiles[who] = { ...(STATE.profiles[who] || {}), ...profile };
        setTimeout(closeModal, 800);
      }
    } catch (e) {
      console.warn('Erreur sauvegarde', e);
    }
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  document.getElementById('modal-overlay').addEventListener('click', function (e) {
    if (e.target === this) closeModal();
  });

  loadStatus();

  // ===================== CŒURS DORÉS FLOTTANTS =====================
  function spawnHeart() {
    const layer = document.getElementById('hearts-layer');
    const heart = document.createElement('div');
    heart.className = 'floating-heart';
    heart.innerHTML = '♥';
    const size = 10 + Math.random() * 16;
    const left = Math.random() * 100;
    const duration = 9 + Math.random() * 8;
    const drift = (Math.random() * 60 - 30) + 'px';
    heart.style.left = left + 'vw';
    heart.style.fontSize = size + 'px';
    heart.style.animationDuration = duration + 's';
    heart.style.setProperty('--drift', drift);
    layer.appendChild(heart);
    setTimeout(() => heart.remove(), duration * 1000 + 500);
  }

  const prefersReducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!prefersReducedMotion) {
    for (let i = 0; i < 4; i++) setTimeout(spawnHeart, i * 900);
    setInterval(spawnHeart, 1800);
  }
</script>
</body>
</html>
